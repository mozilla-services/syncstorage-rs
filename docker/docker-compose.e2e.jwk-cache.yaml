services:
  syncserver:
    environment:
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__KTY: "RSA"
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__ALG: "RS256"
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__KID: "20190730-15e473fd"
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__FXA_CREATED_AT: "1564502400"
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__USE: "sig"
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__N: "15OpVGC7ws_SlU0gRbRh1Iwo8_gR8ElX2CDnbN5blKyXLg-ll0ogktoDXc-tDvTabRTxi7AXU0wWQ247odhHT47y5uz0GASYXdfPponynQ_xR9CpNn1eEL1gvDhQN9rfPIzfncl8FUi9V4WMd5f600QC81yDw9dX-Z8gdkru0aDaoEKF9-wU2TqrCNcQdiJCX9BISotjz_9cmGwKXFEekQNJWBeRQxH2bUmgwUK0HaqwW9WbYOs-zstNXXWFsgK9fbDQqQeGehXLZM4Cy5Mgl_iuSvnT3rLzPo2BmlxMLUvRqBx3_v8BTtwmNGA0v9O0FJS_mnDq0Iue0Dz8BssQCQ"
      SYNC_TOKENSERVER__FXA_OAUTH_PRIMARY_JWK__E: "AQAB"
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: http://mock-fxa-server:6000

      # The FxA-triggered data deletion endpoint. Enabled here rather than in
      # the per-backend files because it requires a configured JWK, and the
      # no-jwk-cache run layers those without one.
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "true"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_AUDIENCE: "urn:mozilla:fxa:tokenserver:sync-data-delete"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ISSUER: "https://accounts.firefox.com"
      # The repo test key, as the secondary JWK. The primary above is a real
      # FxA production key whose private half nobody has, so the delete tests
      # could not sign anything the server would accept.
      SYNC_TOKENSERVER__FXA_OAUTH_SECONDARY_JWK__KTY: "RSA"
      SYNC_TOKENSERVER__FXA_OAUTH_SECONDARY_JWK__ALG: "RS256"
      SYNC_TOKENSERVER__FXA_OAUTH_SECONDARY_JWK__USE: "sig"
      SYNC_TOKENSERVER__FXA_OAUTH_SECONDARY_JWK__N: "wDVLbkUbqt74yyEd1d5HQsmT_BVAMrausJCZq1FHyy9Ham-c6Uobln07-G2Wj_X0PaDUBfKq12M90hPKAsI1gvAIVs9TL6BOvFYQArodTGxya0JLv2GBSiJjgj8LQHL4DYbmvMsvtW6nHCGWtB9Fa9t9aN5R-_fcqj4mk0EzY5xL-cuzzxuMRhreMUL-WE74bzA-b4IT2SIJvYy4yYY0stLvC1DSqKNn9Z6jWMP4qIFz1OCkcJ74_wsUAIoicnVECe0jLEM-6xul6dIXwH2j7t105Kt-FSS-syOHqE-_oenfbrfOn0v0ILjiBPJFa6f3mN1jO4RwyvYj6vut4f9KfQ"
      SYNC_TOKENSERVER__FXA_OAUTH_SECONDARY_JWK__E: "AQAB"
  e2e-tests:
    environment:
      FXA_DELETE_SIGNING_KEY_PEM: /app/tools/fxa_delete/testing/delete_test_key.pem
      SYNC_TOKENSERVER__FXA_DELETE_DATA_AUDIENCE: "urn:mozilla:fxa:tokenserver:sync-data-delete"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ISSUER: "https://accounts.firefox.com"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        PYTHONPATH=/app
        pytest /app/tools/integration_tests/ /app/tools/tokenserver/
        --junit-xml=/${RESULTS_FILENAME}
