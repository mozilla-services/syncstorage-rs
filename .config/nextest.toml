[store]
dir = "target/nextest"

[profile.default]
retries = 0
test-threads = 1
threads-required = 1
status-level = "pass"
final-status-level = "flaky"
failure-output = "immediate"
success-output = "never"
fail-fast = false
slow-timeout = { period = "300s" }

[profile.ci]
fail-fast = false
# The Spanner emulator intermittently fails a request for no good reason, which
# has surfaced in both syncstorage-db and syncserver tests. Retried tests are
# reported as flaky, not silently passed.
retries = 2

[profile.ci.junit]
path = "junit.xml"
report-name = "syncstorage-unit-tests"
store-success-output = false
store-failure-output = true
store-success-timing = true
store-failure-timing = true
